<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>굿즈 발매 캘린더</title>
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css');

:root {
  --bg: #fff8fa;
  --surface: #ffffff;
  --surface-2: #fdf1f4;
  --line: #f1dde3;
  --text: #2d2a32;
  --muted: #8a8191;
  --accent: #ff6f91;
  --accent-ink: #ffffff;
  --today: #fff0c2;
  --shadow: 0 6px 24px rgba(160, 90, 110, .10);
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #18151b; --surface: #221e26; --surface-2: #2a2530; --line: #3a3340;
    --text: #f1ecf4; --muted: #a79eb0; --accent: #ff86a4; --today: #4a3d1e;
    --shadow: 0 6px 24px rgba(0, 0, 0, .35);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: Pretendard, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  background: var(--bg); color: var(--text); line-height: 1.5; -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
.wrap { max-width: 1100px; margin: 0 auto; padding: 20px 16px 60px; }

/* header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.brand { font-size: 22px; font-weight: 800; margin: 0; letter-spacing: -.02em; }
.brand small { display: block; font-size: 12px; font-weight: 500; color: var(--muted); }
.monthnav { display: flex; align-items: center; gap: 6px; }
.monthnav .label { font-size: 20px; font-weight: 800; min-width: 130px; text-align: center; }

.btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 10px;
  padding: 8px 14px; cursor: pointer; font-weight: 600; transition: background .15s, transform .05s;
}
.btn:hover { background: var(--surface-2); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.primary:hover { filter: brightness(1.05); }
.btn.danger { color: #e0445a; }
.btn.sm { padding: 5px 10px; font-size: 13px; border-radius: 8px; }
.btn.icon { width: 38px; height: 38px; padding: 0; display: inline-grid; place-items: center; font-size: 18px; }

/* filters */
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.chipbtn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px;
  font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-weight: 600;
}
.chipbtn .dot { width: 8px; height: 8px; border-radius: 50%; }
.chipbtn.off { opacity: .4; }
.filters select, .filters input, .field input, .field select, .field textarea {
  border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 7px 10px; min-width: 0;
}
.filters input { flex: 1 1 160px; }

/* ongoing popups */
.ongoing { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 14px; }
.ongoing:empty { display: none; }
.ongoing .card {
  flex: 0 0 auto; min-width: 220px; max-width: 280px; background: var(--surface); border: 1px solid var(--line);
  border-left: 4px solid var(--c); border-radius: 12px; padding: 10px 12px; cursor: pointer; box-shadow: var(--shadow);
}
.ongoing .card b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ongoing .card span { font-size: 12px; color: var(--muted); }
.sec-title { font-size: 14px; font-weight: 800; color: var(--muted); margin: 0 0 8px; }

/* calendar */
.cal { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
.cal-head, .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.cal-head div { padding: 8px; text-align: center; font-size: 12px; font-weight: 700; color: var(--muted); background: var(--surface-2); }
.cal-head div:first-child { color: #e0445a; }
.cal-head div:last-child { color: #4a6cf7; }
.day {
  min-height: 112px; border-top: 1px solid var(--line); border-left: 1px solid var(--line); padding: 6px;
  cursor: pointer; display: flex; flex-direction: column; gap: 3px; min-width: 0;
}
.day:nth-child(7n+1) { border-left: 0; }
.day.other { background: color-mix(in srgb, var(--surface-2) 50%, transparent); }
.day.other .num { opacity: .4; }
.day.today { background: var(--today); }
.day.sel { outline: 2px solid var(--accent); outline-offset: -2px; }
.day .num { font-size: 13px; font-weight: 700; }
.day.sun .num { color: #e0445a; } .day.sat .num { color: #4a6cf7; }
.chip {
  display: block; font-size: 11.5px; font-weight: 600; padding: 2px 6px; border-radius: 6px;
  background: color-mix(in srgb, var(--c) 18%, transparent); color: var(--text);
  border-left: 3px solid var(--c); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer;
}
.more { font-size: 11px; color: var(--muted); padding-left: 4px; }
.chips { display: flex; flex-direction: column; gap: 3px; min-width: 0; }

/* list */
.list { margin-top: 22px; }
.list-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.list-head h2 { font-size: 17px; margin: 0; }
.item {
  display: flex; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 12px 14px; margin-bottom: 8px; cursor: pointer; align-items: center;
}
.item:hover { border-color: var(--accent); }
.item .date { flex: 0 0 74px; text-align: center; font-weight: 800; font-size: 15px; line-height: 1.2; }
.item .date small { display: block; font-weight: 500; font-size: 11px; color: var(--muted); }
.item .body { min-width: 0; flex: 1; }
.item .title { font-weight: 700; }
.item .meta { font-size: 12.5px; color: var(--muted); }
.badge {
  display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px;
  background: var(--c); color: #fff; margin-right: 6px; vertical-align: 1px;
}
.empty { text-align: center; color: var(--muted); padding: 30px 0; }

/* modal */
.modal-bg { position: fixed; inset: 0; background: rgba(20, 10, 20, .45); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
.modal-bg.open { display: flex; }
.modal {
  background: var(--surface); border-radius: 18px; max-width: 560px; width: 100%; max-height: 88vh; overflow: auto;
  box-shadow: 0 20px 60px rgba(0, 0, 0, .3); position: relative;
}
.modal img.hero { width: 100%; max-height: 280px; object-fit: cover; display: block; border-radius: 18px 18px 0 0; }
.modal .in { padding: 20px 22px 22px; }
.modal h3 { margin: 6px 0 4px; font-size: 20px; }
.modal .close { position: absolute; top: 10px; right: 10px; background: var(--surface); }
.kv { display: grid; grid-template-columns: 72px 1fr; gap: 8px 10px; margin: 14px 0; font-size: 14px; }
.kv dt { color: var(--muted); font-weight: 600; }
.kv dd { margin: 0; }
table.items { width: 100%; border-collapse: collapse; font-size: 14px; margin: 6px 0 14px; }
table.items th, table.items td { padding: 7px 6px; border-bottom: 1px solid var(--line); text-align: left; }
table.items th { font-size: 12px; color: var(--muted); }
table.items td.p { white-space: nowrap; text-align: right; }
.desc { white-space: pre-wrap; font-size: 14px; background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }
.shop-line { margin-bottom: 4px; }
.shop-line small { color: var(--muted); }

.foot { text-align: center; font-size: 12px; color: var(--muted); margin-top: 30px; }

/* mobile: 달력 칸은 점으로, 상세는 아래 목록에서 */
@media (max-width: 640px) {
  .brand { font-size: 18px; }
  .monthnav .label { font-size: 17px; min-width: 110px; }
  .day { min-height: 58px; padding: 4px; align-items: center; }
  .chips { flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 3px; }
  .chip { font-size: 0; width: 7px; height: 7px; padding: 0; border: 0; border-radius: 50%; background: var(--c); }
  .more { display: none; }
  .item .date { flex-basis: 58px; font-size: 14px; }
  .kv { grid-template-columns: 60px 1fr; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 class="brand" id="siteTitle">굿즈 발매 캘린더<small>신상 발매 · 예약 · 추첨 · 팝업스토어 일정</small></h1>
    <div class="monthnav">
      <button class="btn icon" id="prev" aria-label="이전 달">‹</button>
      <div class="label" id="monthLabel"></div>
      <button class="btn icon" id="next" aria-label="다음 달">›</button>
      <button class="btn sm" id="today">오늘</button>
    </div>
  </header>

  <div id="ongoingWrap">
    <p class="sec-title" id="ongoingTitle" hidden>지금 진행 중인 팝업스토어</p>
    <div class="ongoing" id="ongoing"></div>
  </div>

  <div class="filters">
    <div id="typeFilters" style="display:flex;gap:6px;flex-wrap:wrap"></div>
    <select id="shopFilter"><option value="">전체 판매처</option></select>
    <input id="q" type="search" placeholder="상품명·일정 검색">
  </div>

  <section class="cal" aria-label="월간 달력">
    <div class="cal-head" id="calHead"></div>
    <div class="cal-grid" id="calGrid"></div>
  </section>

  <section class="list">
    <div class="list-head">
      <h2 id="listTitle">이번 달 일정</h2>
      <button class="btn sm" id="clearDay" hidden>달 전체 보기</button>
    </div>
    <div id="list"></div>
  </section>

  <p class="foot" id="updated"></p>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal" role="dialog" aria-modal="true" id="modal"></div>
</div>

<script>
// 공통 상수 / 유틸 — index.html, admin.html 둘 다 사용
const TYPES = {
  release:  { label: '발매',       color: '#ff6f91' },
  preorder: { label: '예약판매',   color: '#6c7bff' },
  lottery:  { label: '추첨·응모',  color: '#a46bff' },
  popup:    { label: '팝업스토어', color: '#ff9f1c' },
  restock:  { label: '재입고',     color: '#2bb486' },
  etc:      { label: '기타',       color: '#8a94a6' },
};
const SHOP_KINDS = { online: '온라인', offline: '오프라인', both: '온·오프라인' };
const WEEK = ['일', '월', '화', '수', '목', '금', '토'];

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function safeUrl(u) {
  u = String(u || '').trim();
  return /^https?:\/\//i.test(u) ? u : '';
}
function pad(n) { return String(n).padStart(2, '0'); }
function ymd(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function parseYmd(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function todayStr() { return ymd(new Date()); }
function fmtDate(s) {
  if (!s) return '';
  const d = parseYmd(s);
  return `${d.getMonth() + 1}.${d.getDate()} (${WEEK[d.getDay()]})`;
}
function fmtRange(ev) {
  const end = ev.end && ev.end !== ev.start ? ` ~ ${fmtDate(ev.end)}` : '';
  const y = ev.start ? parseYmd(ev.start).getFullYear() + '. ' : '';
  return `${y}${fmtDate(ev.start)}${end}${ev.time ? ' · ' + esc(ev.time) : ''}`;
}
function evEnd(ev) { return ev.end && ev.end >= ev.start ? ev.end : ev.start; }
function uid(prefix) { return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function fmtPrice(p) {
  if (p === '' || p == null) return '';
  const n = Number(String(p).replace(/[^\d.]/g, ''));
  return isNaN(n) || String(p).match(/[^\d,.\s원]/) ? esc(p) : n.toLocaleString('ko-KR') + '원';
}
function normalize(data) {
  data = data || {};
  return {
    siteTitle: data.siteTitle || '굿즈 발매 캘린더',
    updatedAt: data.updatedAt || '',
    shops: Array.isArray(data.shops) ? data.shops : [],
    events: Array.isArray(data.events) ? data.events : [],
  };
}
// UTF-8 안전 base64 (GitHub API용)
function b64encode(str) { return btoa(unescape(encodeURIComponent(str))); }
function b64decode(b64) { return decodeURIComponent(escape(atob(b64.replace(/\s/g, '')))); }
</script>
<script>
let DATA = normalize();
const now = new Date();
const state = { y: now.getFullYear(), m: now.getMonth(), types: new Set(Object.keys(TYPES)), shop: '', q: '', day: null };
const $ = id => document.getElementById(id);
const shopById = id => DATA.shops.find(s => s.id === id);
const isMobile = () => matchMedia('(max-width: 640px)').matches;

function matches(ev) {
  if (!state.types.has(ev.type || 'etc')) return false;
  if (state.shop && !(ev.shopIds || []).includes(state.shop)) return false;
  if (state.q) {
    const hay = [ev.title, ev.description, ev.location, ...(ev.items || []).map(i => i.name),
      ...(ev.shopIds || []).map(id => shopById(id)?.name)].join(' ').toLowerCase();
    if (!hay.includes(state.q.toLowerCase())) return false;
  }
  return true;
}
const sortEv = (a, b) => a.start.localeCompare(b.start) || (a.time || '').localeCompare(b.time || '') || a.title.localeCompare(b.title);

function renderFilters() {
  $('typeFilters').innerHTML = Object.entries(TYPES).map(([k, t]) =>
    `<button class="chipbtn ${state.types.has(k) ? '' : 'off'}" data-type="${k}"><span class="dot" style="background:${t.color}"></span>${t.label}</button>`).join('');
  const sel = $('shopFilter');
  sel.innerHTML = '<option value="">전체 판매처</option>' +
    DATA.shops.map(s => `<option value="${esc(s.id)}">${esc(s.name)}</option>`).join('');
  sel.value = state.shop;
}

function renderOngoing() {
  const t = todayStr();
  const list = DATA.events.filter(e => e.type === 'popup' && e.start <= t && evEnd(e) >= t).sort(sortEv);
  $('ongoingTitle').hidden = !list.length;
  $('ongoing').innerHTML = list.map(e => `
    <div class="card" style="--c:${TYPES.popup.color}" data-id="${esc(e.id)}">
      <b>${esc(e.title)}</b>
      <span>~ ${fmtDate(evEnd(e))}${e.location ? ' · ' + esc(e.location) : ''}</span>
    </div>`).join('');
}

const LONG_DAYS = 7; // 이 일수 이상 이어지는 일정은 달력에 시작·종료일만 표시
const isLong = e => e.end && (parseYmd(e.end) - parseYmd(e.start)) / 86400000 + 1 >= LONG_DAYS;

function renderCalendar() {
  $('monthLabel').textContent = `${state.y}년 ${state.m + 1}월`;
  $('calHead').innerHTML = WEEK.map(w => `<div>${w}</div>`).join('');
  const first = new Date(state.y, state.m, 1);
  const start = new Date(state.y, state.m, 1 - first.getDay());
  const lastDate = new Date(state.y, state.m + 1, 0).getDate();
  const cells = Math.ceil((first.getDay() + lastDate) / 7) * 7;
  const evs = DATA.events.filter(matches).sort(sortEv);
  const t = todayStr();
  let html = '';
  for (let i = 0; i < cells; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const ds = ymd(d);
    // 기간이 긴 일정(LONG_DAYS일 이상)은 시작일·종료일 칸에만 표시
    const dayEvs = evs.filter(e => e.start <= ds && evEnd(e) >= ds && (!isLong(e) || ds === e.start || ds === evEnd(e)));
    const cls = ['day', d.getMonth() !== state.m && 'other', ds === t && 'today', ds === state.day && 'sel',
      d.getDay() === 0 && 'sun', d.getDay() === 6 && 'sat'].filter(Boolean).join(' ');
    const shown = dayEvs.slice(0, 3);
    html += `<div class="${cls}" data-day="${ds}">
      <span class="num">${d.getDate()}</span>
      <div class="chips">${(isMobile() ? dayEvs : shown).map(e => {
        const tag = isLong(e) ? (ds === e.start ? '[시작] ' : '[종료] ') : '';
        return `<span class="chip" style="--c:${(TYPES[e.type] || TYPES.etc).color}" data-id="${esc(e.id)}" title="${esc(tag + e.title)}">${esc(tag + e.title)}</span>`;
      }).join('')}</div>
      ${dayEvs.length > 3 ? `<span class="more">+${dayEvs.length - 3}개 더</span>` : ''}
    </div>`;
  }
  $('calGrid').innerHTML = html;
}

function renderList() {
  const mStart = ymd(new Date(state.y, state.m, 1)), mEnd = ymd(new Date(state.y, state.m + 1, 0));
  let evs = DATA.events.filter(matches);
  if (state.day) {
    evs = evs.filter(e => e.start <= state.day && evEnd(e) >= state.day);
    $('listTitle').textContent = `${fmtDate(state.day)} 일정`;
  } else {
    evs = evs.filter(e => e.start <= mEnd && evEnd(e) >= mStart);
    $('listTitle').textContent = `${state.m + 1}월 일정 (${evs.length})`;
  }
  $('clearDay').hidden = !state.day;
  evs.sort(sortEv);
  if (!evs.length) { $('list').innerHTML = '<div class="empty">등록된 일정이 없어요</div>'; return; }
  $('list').innerHTML = evs.map(e => {
    const t = TYPES[e.type] || TYPES.etc;
    const d = parseYmd(e.start);
    const shops = (e.shopIds || []).map(id => shopById(id)?.name).filter(Boolean).join(', ');
    const range = e.end && e.end !== e.start ? `~ ${fmtDate(e.end)}` : WEEK[d.getDay()] + '요일';
    return `<div class="item" data-id="${esc(e.id)}">
      <div class="date">${d.getMonth() + 1}.${d.getDate()}<small>${range}</small></div>
      <div class="body">
        <div class="title"><span class="badge" style="--c:${t.color}">${t.label}</span>${esc(e.title)}</div>
        <div class="meta">${[e.time && esc(e.time), shops && esc(shops), e.location && esc(e.location),
          (e.items || []).length && `상품 ${e.items.length}종`].filter(Boolean).join(' · ')}</div>
      </div>
    </div>`;
  }).join('');
}

function openModal(id) {
  const e = DATA.events.find(x => x.id === id);
  if (!e) return;
  const t = TYPES[e.type] || TYPES.etc;
  const shops = (e.shopIds || []).map(shopById).filter(Boolean);
  const img = safeUrl(e.image), link = safeUrl(e.link);
  $('modal').innerHTML = `
    <button class="btn icon close" aria-label="닫기" data-close>×</button>
    ${img ? `<img class="hero" src="${esc(img)}" alt="">` : ''}
    <div class="in">
      <span class="badge" style="--c:${t.color}">${t.label}</span>
      <h3>${esc(e.title)}</h3>
      <dl class="kv">
        <dt>일정</dt><dd>${fmtRange(e)}</dd>
        ${e.location ? `<dt>장소</dt><dd>${esc(e.location)}</dd>` : ''}
        ${shops.length ? `<dt>판매처</dt><dd>${shops.map(s => {
          const u = safeUrl(s.url);
          return `<div class="shop-line">${u ? `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(s.name)}</a>` : esc(s.name)}
            <small>${SHOP_KINDS[s.kind] || ''}${s.address ? ' · ' + esc(s.address) : ''}</small></div>`;
        }).join('')}</dd>` : ''}
      </dl>
      ${(e.items || []).length ? `
        <table class="items"><thead><tr><th>상품</th><th>비고</th><th style="text-align:right">가격</th></tr></thead><tbody>
        ${e.items.map(i => `<tr><td>${esc(i.name)}</td><td>${esc(i.note || '')}</td><td class="p">${fmtPrice(i.price)}</td></tr>`).join('')}
        </tbody></table>` : ''}
      ${e.description ? `<div class="desc">${esc(e.description)}</div>` : ''}
      ${link ? `<p style="margin:16px 0 0"><a class="btn primary" href="${esc(link)}" target="_blank" rel="noopener" style="text-decoration:none;display:inline-block">공지 / 구매 페이지 열기</a></p>` : ''}
    </div>`;
  $('modalBg').classList.add('open');
  history.replaceState(null, '', '#e=' + encodeURIComponent(id));
}
function closeModal() {
  $('modalBg').classList.remove('open');
  history.replaceState(null, '', location.pathname + location.search);
}

function render() { renderCalendar(); renderList(); }
function go(delta) {
  const d = new Date(state.y, state.m + delta, 1);
  state.y = d.getFullYear(); state.m = d.getMonth(); state.day = null; render();
}

// events
$('prev').onclick = () => go(-1);
$('next').onclick = () => go(1);
$('today').onclick = () => { state.y = now.getFullYear(); state.m = now.getMonth(); state.day = null; render(); };
$('clearDay').onclick = () => { state.day = null; render(); };
$('typeFilters').onclick = e => {
  const b = e.target.closest('[data-type]'); if (!b) return;
  const k = b.dataset.type;
  // 전부 켜져 있을 때 누르면 그 종류만 보기
  if (state.types.size === Object.keys(TYPES).length) state.types = new Set([k]);
  else if (state.types.has(k)) { state.types.delete(k); if (!state.types.size) state.types = new Set(Object.keys(TYPES)); }
  else state.types.add(k);
  renderFilters(); render();
};
$('shopFilter').onchange = e => { state.shop = e.target.value; render(); };
$('q').oninput = e => { state.q = e.target.value.trim(); render(); };
$('calGrid').onclick = e => {
  const chip = e.target.closest('.chip');
  if (chip && !isMobile()) return openModal(chip.dataset.id);
  const day = e.target.closest('.day'); if (!day) return;
  state.day = state.day === day.dataset.day ? null : day.dataset.day;
  render();
  if (isMobile() && state.day) $('listTitle').scrollIntoView({ behavior: 'smooth', block: 'start' });
};
$('list').onclick = e => { const it = e.target.closest('.item'); if (it) openModal(it.dataset.id); };
$('ongoing').onclick = e => { const c = e.target.closest('.card'); if (c) openModal(c.dataset.id); };
$('modalBg').onclick = e => { if (e.target === $('modalBg') || e.target.closest('[data-close]')) closeModal(); };
addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
matchMedia('(max-width: 640px)').addEventListener('change', renderCalendar);

// load
fetch('data.json?t=' + Date.now())
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(d => {
    DATA = normalize(d);
    document.title = DATA.siteTitle;
    $('siteTitle').firstChild.textContent = DATA.siteTitle;
    if (DATA.updatedAt) $('updated').textContent = '마지막 업데이트 ' + new Date(DATA.updatedAt).toLocaleString('ko-KR');
    renderFilters(); renderOngoing(); render();
    const m = location.hash.match(/^#e=(.+)$/);
    if (m) {
      const ev = DATA.events.find(x => x.id === decodeURIComponent(m[1]));
      if (ev) { const d = parseYmd(ev.start); state.y = d.getFullYear(); state.m = d.getMonth(); render(); openModal(ev.id); }
    }
  })
  .catch(() => { renderFilters(); render(); $('list').innerHTML = '<div class="empty">일정 데이터를 불러오지 못했어요 (data.json 확인)</div>'; });
</script>
</body>
</html>
